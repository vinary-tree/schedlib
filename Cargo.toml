[package]
name = "schedlib"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Dylon Edwards <dylon@f1r3fly.io>"]
description = "Formally refined deterministic scheduling for Vinary pipelines"
license = "Apache-2.0"
repository = "https://github.com/vinary-tree/schedlib"
homepage = "https://github.com/vinary-tree/schedlib"
documentation = "https://docs.rs/schedlib"
readme = "README.md"
publish = ["crates-io"]
keywords = ["scheduling", "deterministic", "concurrency", "stack-safe"]
categories = ["algorithms", "concurrency"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/docs/**",
    "/formal/**",
    "/scripts/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/Makefile",
    "/README.md",
]

[features]
default = []
rayon = ["dep:rayon"]

[workspace]
members = ["."]
resolver = "2"

[dependencies]
libvgraph = "=0.1.0"
rayon = { version = "=1.12.0", optional = true }

[[test]]
name = "refinement"
path = "tests/refinement.rs"

[[test]]
name = "rayon_refinement"
path = "tests/rayon_refinement.rs"
required-features = ["rayon"]

[[example]]
name = "rayon"
path = "examples/rayon.rs"
required-features = ["rayon"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
