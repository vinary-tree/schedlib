<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1309px" preserveAspectRatio="none" style="width:512px;height:1309px;background:#F8FAFC;" version="1.1" viewBox="0 0 512 1309" width="512px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#F8FAFC" height="1309" style="stroke:none;stroke-width:1;" width="512" x="0" y="0"/><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="247.491" x="129.0751" y="24.9659">Verification and Acceptance Ladder</text></g><!--entity Model--><g class="entity" data-qualified-name="Model" data-source-line="10" id="ent0001"><rect fill="#93C5FD" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="187.3973" x="218.6" y="47.0679"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.3973" x="228.6" y="72.0339">Write TLA+ state machine</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119.2095" x="228.6" y="91.1018">and shared kernel</text></g><!--entity Proof--><g class="entity" data-qualified-name="Proof" data-source-line="11" id="ent0002"><rect fill="#A5B4FC" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="192.2553" x="135.17" y="166.2079"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="172.2553" x="145.17" y="191.1739">Prove nonrecursive kernel</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.1837" x="145.17" y="210.2418">with TLAPS</text></g><!--entity Exhaust--><g class="entity" data-qualified-name="Exhaust" data-source-line="12" id="ent0003"><rect fill="#60A5FA" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="212.9332" x="104.83" y="285.3479"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192.9332" x="114.83" y="310.3139">Exhaust every bounded input</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.4434" x="114.83" y="329.3818">and reachable TLC state</text></g><!--entity Counterexample--><g class="entity" data-qualified-name="Counterexample" data-source-line="13" id="ent0004"><rect fill="#FDE68A" height="39.0679" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="135.7935" x="143.4" y="404.4779"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="115.7935" x="153.4" y="429.4439">Counterexample?</text></g><!--entity Correct--><g class="entity" data-qualified-name="Correct" data-source-line="14" id="ent0005"><rect fill="#FCA5A5" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="222.6912" x="275.95" y="522.5479"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.7674" x="285.95" y="547.5139">Correct the specification</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.6912" x="285.95" y="566.5818">without weakening obligations</text></g><!--entity Registry--><g class="entity" data-qualified-name="Registry" data-source-line="15" id="ent0006"><rect fill="#C4B5FD" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="196.3713" x="44.11" y="522.5479"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.3713" x="54.11" y="547.5139">Extract every invariant into</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="152.8094" x="54.11" y="566.5818">the refinement registry</text></g><!--entity Tests--><g class="entity" data-qualified-name="Tests" data-source-line="16" id="ent0007"><rect fill="#F9A8D4" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="253.2251" x="15.69" y="641.6879"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.1334" x="25.69" y="666.6539">Add exhaustive, property,</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="233.2251" x="25.69" y="685.7218">metamorphic, and small-stack tests</text></g><!--entity Red--><g class="entity" data-qualified-name="Red" data-source-line="17" id="ent0008"><rect fill="#FED7AA" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="255.1291" x="14.73" y="760.8179"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.3872" x="24.73" y="785.7839">Observe the test-only baseline</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="235.1291" x="24.73" y="804.8518">fail for missing production behavior</text></g><!--entity Implement--><g class="entity" data-qualified-name="Implement" data-source-line="18" id="ent0009"><rect fill="#86EFAC" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="228.6272" x="27.99" y="879.9579"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.9095" x="37.99" y="904.9239">Implement iterative,</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.6272" x="37.99" y="923.9918">optimized production machines</text></g><!--entity Correctness--><g class="entity" data-qualified-name="Correctness" data-source-line="19" id="ent0010"><rect fill="#6EE7B7" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="219.5412" x="32.53" y="999.0879"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.9894" x="42.53" y="1024.0539">Run correctness, stack,</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.5412" x="42.53" y="1043.1218">complexity, and lifecycle gates</text></g><!--entity Performance--><g class="entity" data-qualified-name="Performance" data-source-line="20" id="ent0011"><rect fill="#FCD34D" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="228.9912" x="27.8" y="1118.2279"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208.9912" x="37.8" y="1143.1939">Run preregistered performance</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="132.4255" x="37.8" y="1162.2618">and allocation gates</text></g><!--entity Acceptance--><g class="entity" data-qualified-name="Acceptance" data-source-line="21" id="ent0012"><rect fill="#2DD4BF" height="58.1358" rx="6" ry="6" style="stroke:#334155;stroke-width:0.5;" width="270.599" x="7" y="1237.3579"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="250.599" x="17" y="1262.3239">Lint documentation, render diagrams,</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.7193" x="17" y="1281.3918">and pass the pgmcp bug gate</text></g><!--link Model to Proof--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="23" id="lnk13"><path d="M292.69,105.4979 C280.05,123.7779 266.5136,143.3553 253.8536,161.6653" fill="none" id="Model-to-Proof" style="stroke:#2563EB;stroke-width:1;"/><polygon fill="#2563EB" points="251.01,165.7779,259.4186,160.65,253.8536,161.6653,252.8383,156.1003,251.01,165.7779" style="stroke:#2563EB;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Proof to Exhaust--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="24" id="lnk14"><path d="M226.46,224.6279 C223.