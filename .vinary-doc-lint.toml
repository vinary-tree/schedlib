version = 1
exclude = [
    ".git",
    "target",
    "node_modules",
    "vendor",
]

[rules]

[network]
enabled = true
timeout_ms = 8000
max_redirects = 5
max_response_bytes = 2097152
allow_private = false

[diagrams]
run_compilers = false
timeout_ms = 15000

[limits]
max_file_bytes = 16777216
max_diagnostics_per_file = 10000
max_fix_passes = 8
max_workspace_files = 10000
max_workspace_bytes = 268435456
max_parallel_files = 1
